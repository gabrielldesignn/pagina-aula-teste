<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#04060D"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDE2FF"/>
      <stop offset="55%" stop-color="#5BB7F7"/>
      <stop offset="100%" stop-color="#2A8FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#5BB7F7" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5BB7F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- rounded dark square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- inner glow -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#glow)"/>

  <!-- subtle border -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.5" ry="13.5"
        fill="none" stroke="#5BB7F7" stroke-opacity="0.25" stroke-width="1"/>

  <!-- big condensed A (Bebas Neue style — drawn as path for crispness) -->
  <g filter="url(#blur)">
    <path d="M 19 50 L 28 14 L 36 14 L 45 50 L 38.5 50 L 36.5 42 L 27.5 42 L 25.5 50 Z M 29.2 35 L 34.8 35 L 32 23 Z"
          fill="url(#letter)"/>
  </g>

  <!-- horizontal cyan accent line at bottom of A (signature mark) -->
  <rect x="20" y="54" width="24" height="2" rx="1" fill="#5BB7F7" fill-opacity="0.85"/>
</svg>
